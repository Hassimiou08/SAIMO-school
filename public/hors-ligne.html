<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne — SAIMO</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; color: #0f1b3d; }
    .carte { max-width: 420px; margin: 16px; padding: 32px; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 16px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    img { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #4b5563; margin: 0 0 20px; }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a, button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 10px 18px;
      cursor: pointer; text-decoration: none; }
    button { background: #2563eb; color: #fff; border: 0; }
    a { color: #2563eb; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>
  <div class="carte">
    <img src="/saimo-logo.png" alt="SAIMO">
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n'a pas encore été enregistrée sur cet appareil. Les pages déjà ouvertes, ou préparées pour le
      hors-ligne, restent accessibles. Vos saisies seront synchronisées au retour de la connexion.</p>
    <div class="actions">
      <button onclick="location.reload()">Réessayer</button>
      <a href="javascript:history.back()">Retour</a>
    </div>
  </div>
</body>
</html>
